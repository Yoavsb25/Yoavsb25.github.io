name: Content
description: Add or update a project, post, or profile info
labels: [content]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options: [Project / case study, Blog post, About / experience, Other]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Links, notes, or draft text.
    validations:
      required: true
