name: Bug
description: Something on the site or in the tooling is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the page URL or command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
