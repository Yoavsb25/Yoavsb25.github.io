# Local git hooks. Same standards as CI, scoped to staged files for speed.
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{js,mjs,ts,astro,json,md,yml,yaml,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{js,mjs,ts,astro}"
      run: npx eslint --max-warnings 0 --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
