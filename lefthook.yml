# Local git hooks. Same standards as CI; pre-commit is scoped to staged files for speed.
pre-commit:
  parallel: true
  commands:
    secrets:
      run: node scripts/guards/scan-staged-secrets.mjs {staged_files}
    files:
      run: node scripts/guards/check-staged-files.mjs {staged_files}
    prettier:
      glob: "*.{js,mjs,ts,astro,json,md,yml,yaml,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{js,mjs,ts,astro}"
      run: npx eslint --max-warnings 0 --fix {staged_files}
      stage_fixed: true

# Every CI check that runs on a Mac, so a push should not turn a PR red (ADR-0020).
pre-push:
  commands:
    ci-local:
      run: npm run ci:local

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
